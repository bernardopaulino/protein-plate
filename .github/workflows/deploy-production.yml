name: Deploy produção
# Manual, depois da checklist de lançamento (docs/sessoes.md, sessão 13)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escreve "produção" para confirmar'
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'produção'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      # Em produção não há valores por confirmar: o content:check corre sem --allow-todo
      - run: npm run content:check
      - run: npm test
      - run: npm run db:migrate:production
      - run: npm run content:build && npx wrangler d1 execute DB --remote --env production --file=.seed/foods.sql
      - run: npm run deploy:production
