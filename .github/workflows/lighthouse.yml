name: Lighthouse
# Mínimo de 90 nas 4 categorias em mobile, mediana de 5 corridas por página (com 3, o ruído do
# runner decidia). Fora do CI de cada push: corre depois do deploy, por isso não protegia nada, e
# um runner lento chegava para o pôr a vermelho. Corre à segunda de manhã contra o staging e à mão
# contra o staging ou a produção.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente a medir
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LHCI_BASE_URL: ${{ inputs.target == 'production' && 'https://protein-plate.app' || 'https://staging.protein-plate.app' }}
      LHCI_RUNS: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      # Acorda o Worker (o primeiro pedido paga o arranque a frio)
      - run: for p in / /en /entrar /alimentos /alimentos/skyr-natural; do curl -s -o /dev/null "$LHCI_BASE_URL$p"; done
      - run: npm run test:lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ inputs.target || 'staging' }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
