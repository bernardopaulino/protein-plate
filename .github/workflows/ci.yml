name: CI
on:
  push:
    branches: [main]
  pull_request:
# O token da CI só lê o repositório
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Ações fixadas pelo commit (uma tag pode mudar de sítio); a versão fica no comentário
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      # Os alimentos são válidos (TODO aceite até acabar a curadoria; a produção corre sem a flag)
      - run: npm run content:check -- --allow-todo
      # O módulo tipado está atualizado com content/foods
      - run: npm run content:build && git diff --exit-code -- src/content
      - run: npm test
      # O backoffice (admin/): tipos do Worker, testes no runtime dos Workers com uma D1 local e
      # o bundle de produção (sem publicar)
      - run: npm run admin:typecheck
      - run: npm run admin:test
      - run: npx wrangler deploy -c admin/wrangler.jsonc --dry-run --env production
      # O schema e as migrações batem certo
      - run: npx drizzle-kit generate && git diff --exit-code -- migrations
      # Os tipos do Worker batem com o wrangler.jsonc
      - run: npx wrangler types cloudflare-env.d.ts --env-interface CloudflareEnv --env-file .dev.vars.example --check
      - run: npx opennextjs-cloudflare build
      - run: npx wrangler deploy --dry-run --env production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: open-next
          path: .open-next
          include-hidden-files: true
          retention-days: 1
      # Nenhuma vulnerabilidade alta ou crítica no código que corre no Worker (o CLI do OpenNext,
      # o wrangler e o drizzle-kit são ferramentas de build: ficam em devDependencies)
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-next
          path: .open-next
      - run: npx playwright install --with-deps chromium
      # Segredos só de teste (o .dev.vars não existe na CI)
      - run: |
          cp .dev.vars.example .dev.vars
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .dev.vars
          sed -i "s|^IP_HASH_SECRET=.*|IP_HASH_SECRET=$(openssl rand -base64 32)|" .dev.vars
      - run: npm run db:migrate:local && npm run content:build && npx wrangler d1 execute DB --local --file=.seed/foods.sql
        env:
          CI: "true"
        shell: bash
      - run: npx playwright test
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    # Indicativo nos PRs (não bloqueia): o Worker local não comprime as respostas, por isso a
    # performance simulada fica abaixo da real. A medida que conta é a do staging (lighthouse-staging)
    needs: check
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: open-next
          path: .open-next
      - run: |
          cp .dev.vars.example .dev.vars
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .dev.vars
          sed -i "s|^IP_HASH_SECRET=.*|IP_HASH_SECRET=$(openssl rand -base64 32)|" .dev.vars
          npm run db:migrate:local && npm run content:build && npx wrangler d1 execute DB --local --file=.seed/foods.sql
      - run: |
          npx wrangler dev --port 8787 --log-level warn &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://localhost:8787/api/health && break; sleep 1; done
          npm run test:lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7

  deploy-staging:
    # Merge em main → staging + migrações (precisa de CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    outputs:
      deployed: ${{ steps.secrets.outputs.ok }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::Sem CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID: deploy de staging ignorado"; fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run db:migrate:staging
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run content:build && npx wrangler d1 execute DB --remote --env staging --file=.seed/foods.sql
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy:staging

  lighthouse-staging:
    # Depois do deploy: mínimo de 90 nas 4 categorias em mobile, mediana de 5 corridas por página (com 3, o ruído do runner decidia)
    needs: deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LHCI_BASE_URL: https://staging.protein-plate.app
      LHCI_RUNS: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      # Acorda o Worker novo (o primeiro pedido paga o arranque a frio)
      - run: for p in / /entrar /alimentos /alimentos/skyr-natural; do curl -s -o /dev/null "$LHCI_BASE_URL$p"; done
      - run: npm run test:lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-staging
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
